function tone(f,t0,dur,vol,type){var o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=f;

// 夕方はゆったり安らぎ → 夜に向けてテンポ・音色・リズムが盛り上がる

// タブが裏に回ったら音を止める
document.addEventListener("visibilitychange",function(){

function zap(){
  if(!ac)return;var now=ac.currentTime,len=Math.floor(ac.sampleRate*0.08),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);

function sndGet(){if(!ac)return;var now=ac.currentTime;[660,880].forEach(function(fr,i){var o=ac.createOscillator(),g2=ac.createGain();o.type="triangle";o.frequency.value=fr;
  g2.gain.setValueAtTime(0.15,now+i*0.08);g2.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.15);o.connect(g2);g2.connect(ac.destination);o.start(now+i*0.08);o.stop(now+i*0.08+0.16)})}

var PTS={stag:[60,"+60 クワガタ！","#00ffff"],black:[30,"+30 BLACK!","#ff3366"],normal:[10,"+10","#ffea78"],gold:[100,"+100 金カメムシ！SLOW","#ffd700"],boss:[150,"+150 撃破！","#ff6644"]};

function btnRect(i){var w=Math.min(160,W*0.42),h=58;return{x:i===0?W/2-w-8:W/2+8,y:H-h-16-SAB,w:w,h:h}}

  if(i===0){

var RANKS=[[0,"E","電球を守れなかった…もう一度挑戦！"],[1000,"D","カメムシの見習いハンター"],[3000,"C","なかなかの腕前！夜も安心！"],[7000,"B","カメムシ撃退プロフェッショナル！"],[13000,"A","虫の王者！電球の守護神！"],[22000,"S","伝説の昆虫マスター！圧倒的スピード！"]];
function comment(s){var i=0;while(i+1<RANKS.length&&s>=RANKS[i+1][0])i++;return{r:RANKS[i][1],txt:RANKS[i][2],next:i+1<RANKS.length?RANKS[i+1][0]-s:0}}
function legs(size,col,w,fn){g.strokeStyle=col;g.lineWidth=w;[-1,1].forEach(function(sd){fn(sd)})}
function draw(b){

  g.rotate(b.rot!==undefined?b.rot:a+Math.PI/2+(b.type==="spider"?Math.cos(b.sa*8)*0.3:0));
  var z=b.size;
  if(b.type==="stag"){
    var lm=Math.sin(b.sa*12)*z*0.15;
    legs(z,"#000",2.5,function(s){
      [[-0.2,-0.5,-0.7,1],[0,-0.1,0.1,-1],[0.2,0.5,0.75,1]].forEach(function(l){
        g.beginPath();g.moveTo(s*z*0.22,z*l[0]);g.lineTo(s*z*0.75+lm*l[3],z*l[1]);g.lineTo(s*z*0.88+lm*l[3],z*l[2]);g.stroke()})});

    g.fillStyle=bg;g.shadowColor="#ffd700";g.shadowBlur=b.type==="gold"?20:0;g.strokeStyle=bk?"#000":"#14260a";g.lineWidth=2;g.beginPath();
    g.moveTo(0,-z*0.65);g.lineTo(z*0.48,-z*0.3);g.lineTo(z*0.42,z*0.4);g.lineTo(0,z*0.68);g.lineTo(-z*0.42,z*0.4);g.lineTo(-z*0.48,-z*0.3);g.closePath();g.fill();g.stroke();
    g.fillStyle=bk?"#22222b":(b.type==="gold"?"#fff2a0":(b.type==="boss"?"#ff8a6a":"#3b6b1f"));g.beginPath();g.moveTo(0,-z*0.28);g.lineTo(z*0.28,z*0.12);g.lineTo(-z*0.28,z*0.12);g.closePath();g.fill();g.stroke();

function tap(px,py){
  initAudio();

  for(var bi=0;bi<2;bi++){var rc=btnRect(bi);if(px>=rc.x&&px<=rc.x+rc.w&&py>=rc.y&&py<=rc.y+rc.h){useItem(bi);return}}
  if(armed){swat(px,py);return}
  for(var j=0;j<items.length;j++){if(Math.hypot(px-items[j].x,py-items[j].y)<54){var it=items.splice(j,1)[0];stock[it.k]=Math.min(2,stock[it.k]+1);sndGet();burst(it.x,it.y,"#9ff",10);
    fx.push({x:it.x,y:it.y-20,text:(it.k==="spray"?"殺虫剤":"ハエ叩き")+" GET!",color:"#9ff",l:0.9});return}}
  var hit=null,md=1e9;
  bugs.forEach(function(b){if(b.dead)return;var d=Math.hypot(px-b.x,py-b.y);if(d<b.size*1.8&&d<md){hit=b;md=d}});
